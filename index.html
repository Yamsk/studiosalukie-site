<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Salukie</title>
<meta name="description" content="Studio Salukie — mobile games. Emerji: Puzzle Adventure, coming soon.">
<style>
  :root { --ink:#1d1a2b; --muted:#6b6580; --accent:#7c4dff; --bg:#faf9fd; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background:
      radial-gradient(1200px 600px at 50% -10%, #efe9ff 0%, rgba(239,233,255,0) 60%),
      var(--bg);
    color: var(--ink);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; min-height: 100%;
  }
  main {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 40px 22px;
  }
  .badge {
    display: inline-block; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase;
    color: var(--accent); background: #efe9ff; border-radius: 999px; padding: 6px 14px; margin-bottom: 22px;
    font-weight: 600;
  }
  h1 { font-size: clamp(2.2rem, 8vw, 3.4rem); margin: 0 0 10px; letter-spacing: -0.02em; }
  .tag { color: var(--muted); font-size: 1.1rem; margin: 0 0 4px; }
  .soon { color: var(--ink); font-weight: 600; margin: 26px 0 0; }
  .soon span { color: var(--accent); }
  footer {
    text-align: center; padding: 24px; color: var(--muted); font-size: .9rem;
  }
  footer a { color: var(--muted); text-decoration: none; border-bottom: 1px solid #dcd6ec; }
  footer a:hover { color: var(--accent); border-color: var(--accent); }
  .dot { margin: 0 8px; opacity: .5; }
</style>
</head>
<body>
  <main>
    <span class="badge">Studio Salukie</span>
    <h1>We make mobile games.</h1>
    <p class="tag">Small studio. Big little worlds.</p>
    <p class="soon"><span>Emerji: Puzzle Adventure</span> — coming soon.</p>
  </main>
  <footer>
    <a href="/privacy">Privacy Policy</a>
    <span class="dot">·</span>
    <a href="mailto:support@studiosalukie.com">support@studiosalukie.com</a>
  </footer>
</body>
</html>
