<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emerji: Puzzle Adventure — Studio Salukie</title>
<meta name="description" content="Emerji: Puzzle Adventure — solve puzzles, rescue the good emojis, and build them a cozy home. A mobile game by Studio Salukie. Coming soon to iOS & Android.">
<meta name="theme-color" content="#2f173a">
<meta property="og:title" content="Emerji: Puzzle Adventure">
<meta property="og:description" content="Solve puzzles & build a cozy home for your emojis. Coming soon to iOS & Android.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://studiosalukie.com/">
<meta property="og:image" content="https://studiosalukie.com/assets/hero.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>😊</text></svg>">
<style>
  :root { --ink:#f2ecfa; --muted:#b3a7c8; --accent:#7c4dff; --bg:#2f173a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; min-height: 100%;
  }

  /* ---------- Hero banner ---------- */
  .hero {
    position: relative; overflow: hidden; color: #fff; text-align: center;
    min-height: clamp(360px, 66vh, 620px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 56px 22px 72px;
    background:
      radial-gradient(125% 105% at 50% 44%, rgba(12,5,28,.22) 0%, rgba(12,5,28,.66) 100%),
      url("assets/hero.jpg") center / cover no-repeat;
  }
  .hero::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 90px;
    background: linear-gradient(to bottom, rgba(250,249,253,0), var(--bg));
    pointer-events: none;
  }
  .hero > * { position: relative; z-index: 1; }
  .studio {
    display: inline-block; font-size: .78rem; letter-spacing: .14em; text-transform: uppercase;
    font-weight: 700; color: #fff;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.34);
    border-radius: 999px; padding: 6px 15px; margin-bottom: 22px;
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  .title {
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 800; font-size: clamp(3.2rem, 15vw, 6rem); line-height: .92; margin: 0;
    letter-spacing: -.02em; text-shadow: 0 3px 22px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.5);
  }
  .subtitle { font-weight: 700; font-size: clamp(1.05rem, 4.6vw, 1.65rem); margin: 8px 0 0; letter-spacing: .06em; text-transform: uppercase; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  .tag { max-width: 500px; margin: 20px auto 0; font-size: clamp(1rem, 3.6vw, 1.18rem); text-shadow: 0 1px 10px rgba(0,0,0,.6); }
  .soon {
    display: inline-block; margin-top: 30px; font-weight: 700; font-size: 1rem;
    background: #fff; color: var(--accent); border-radius: 999px; padding: 11px 22px;
    box-shadow: 0 10px 28px rgba(0,0,0,.35);
  }

  /* ---------- Below the banner ---------- */
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 34px 22px; }
  main h2 { font-size: 1.15rem; margin: 0 0 6px; letter-spacing: -.01em; }
  main p { color: var(--muted); margin: 0; }
  footer { text-align: center; padding: 24px; color: var(--muted); font-size: .9rem; }
  footer a { color: var(--muted); text-decoration: none; border-bottom: 1px solid rgba(255,255,255,.20); }
  footer a:hover { color: var(--accent); border-color: var(--accent); }
  .dot { margin: 0 8px; opacity: .5; }
</style>
</head>
<body>
  <header class="hero">
    <span class="studio">Studio Salukie</span>
    <h1 class="title">Emerji</h1>
    <p class="subtitle">Puzzle Adventure</p>
    <p class="tag">Solve puzzles, rescue the good emojis, and build them a cozy home.</p>
    <span class="soon">✨ Coming soon — iOS &amp; Android</span>
  </header>

  <main>
    <h2>Small studio. Big little worlds.</h2>
    <p>More emoji adventures on the way.</p>
  </main>

  <footer>
    <a href="/privacy">Privacy Policy</a>
    <span class="dot">·</span>
    <a href="mailto:support@studiosalukie.com">support@studiosalukie.com</a>
  </footer>
</body>
</html>
